name: Build image

# Builds dArkOSen-Extended images: the official dArkOSen release image
# with the boot video tool injected, published as a split .7z release
# tagged "<upstream tag>-ext".
#
# - schedule / push:  build the latest upstream release if we have no
#                     "-ext" release for it yet
# - workflow_dispatch: pick a tag, force a rebuild, publish as draft
#
# Builds started from a branch other than the default branch are always
# published as drafts. A push to the default branch promotes such a draft
# to a published release instead of rebuilding it.

on:
  schedule:
    - cron: '23 5 * * *'
  push:
    branches: [main, 'ext/**']
    paths:
      - 'extended/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag (empty = latest)'
        required: false
        default: ''
      force:
        description: 'Rebuild even if the -ext release already exists'
        type: boolean
        default: false
      draft:
        description: 'Publish as a draft release'
        type: boolean
        default: false
      level:
        description: '7z compression level (lower = faster, bigger)'
        type: choice
        options: ['1', '3', '5', '7', '9']
        default: '5'

permissions:
  contents: write

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  UPSTREAM: djparentx/dArkOSen-R36S

jobs:
  check:
    name: Check for a new upstream release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      ext_tag: ${{ steps.r.outputs.ext_tag }}
      build: ${{ steps.r.outputs.build }}
      draft: ${{ steps.r.outputs.draft }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IN_TAG: ${{ inputs.tag }}
          IN_FORCE: ${{ inputs.force }}
          IN_DRAFT: ${{ inputs.draft }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          TAG="$IN_TAG"
          [ -n "$TAG" ] || TAG=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          EXT="${TAG}-ext"
          ON_DEFAULT=false; [ "$REF_NAME" = "$DEFAULT_BRANCH" ] && ON_DEFAULT=true
          DRAFT="${IN_DRAFT:-false}"; [ "$ON_DEFAULT" = true ] || DRAFT=true
          BUILD=true

          if IS_DRAFT=$(gh release view "$EXT" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "${IN_FORCE:-false}" = "true" ]; then
              echo "Release $EXT exists; forced rebuild, deleting it first"
              gh release delete "$EXT" --yes --cleanup-tag || gh release delete "$EXT" --yes
            elif [ "$IS_DRAFT" = "true" ] && [ "$ON_DEFAULT" = true ] && [ "$EVENT" = "push" ]; then
              echo "Draft release $EXT exists and $DEFAULT_BRANCH was updated: publishing it"
              gh release edit "$EXT" --draft=false
              BUILD=false
            else
              echo "Release $EXT already exists (draft=$IS_DRAFT); nothing to build"
              BUILD=false
            fi
          else
            echo "No release $EXT yet; building from upstream $TAG"
          fi

          {
            echo "tag=$TAG"
            echo "ext_tag=$EXT"
            echo "build=$BUILD"
            echo "draft=$DRAFT"
          } >> "$GITHUB_OUTPUT"
          echo "### Build image" >> "$GITHUB_STEP_SUMMARY"
          echo "- upstream tag: \`$TAG\`  -  our release: \`$EXT\`  -  build: $BUILD  -  draft: $DRAFT" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and publish ${{ needs.check.outputs.ext_tag }}
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: extended
          sparse-checkout-cone-mode: true

      - name: Free disk space
        run: |
          echo "before:"; df -h / /mnt 2>/dev/null || df -h /
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /mnt/swapfile /swapfile 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/julia* /usr/share/miniconda \
                      /opt/microsoft /usr/local/share/powershell /usr/lib/jvm /usr/local/lib/node_modules \
                      /usr/local/share/chromium /usr/local/share/chrome* /opt/google 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean >/dev/null 2>&1 || true
          echo "after:"; df -h / /mnt 2>/dev/null || df -h /

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full jq btrfs-progs >/dev/null
          sudo modprobe btrfs 2>/dev/null || true
          grep -qw btrfs /proc/filesystems && echo "btrfs: available" || echo "::warning::btrfs is not available in this kernel"

      - name: Pick the work directory
        id: wd
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/work"
          if [ -d /mnt ]; then
            FREE_MNT=$(df --output=avail -k /mnt | tail -1 | tr -d ' ')
            FREE_TMP=$(df --output=avail -k "$RUNNER_TEMP" | tail -1 | tr -d ' ')
            if [ "$FREE_MNT" -gt "$FREE_TMP" ]; then W=/mnt/work; fi
          fi
          sudo mkdir -p "$W" && sudo chown "$(id -u):$(id -g)" "$W"
          echo "dir=$W" >> "$GITHUB_OUTPUT"
          df -h "$W"
          echo "::notice title=Work directory::$W with $(df -h --output=avail "$W" | tail -1 | tr -d ' ') free (root: $(df -h --output=avail / | tail -1 | tr -d ' '), /mnt: $(df -h --output=avail /mnt 2>/dev/null | tail -1 | tr -d ' '))"

      - name: Build the image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          WORK: ${{ steps.wd.outputs.dir }}
          LEVEL: ${{ inputs.level || '5' }}
        run: |
          set +e
          sudo -E bash extended/build/build-image.sh \
            --repo "$UPSTREAM" --tag "$TAG" \
            --workdir "$WORK" --out "$WORK/out" \
            --level "$LEVEL" --videos extended/bootvideos
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            # Surface the failure as an annotation (readable without logging in)
            msg=$(tail -n 30 "$WORK/out/build.log" 2>/dev/null | cut -c1-200 | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3800)
            echo "::error title=build-image.sh failed with exit code $rc::${msg:-no build.log}"
            df -h "$WORK" / 2>/dev/null || true
            exit "$rc"
          fi
          echo "::notice title=Build::$(grep -E 'packed:|done:' "$WORK/out/build.log" | tr '\n' ' ')"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          EXT: ${{ needs.check.outputs.ext_tag }}
          DRAFT: ${{ needs.check.outputs.draft }}
          OUT: ${{ steps.wd.outputs.dir }}/out
        run: |
          set -euo pipefail
          args=(--title "dArkOSen-Extended_R36_$TAG" --notes-file "$OUT/RELEASE_NOTES.md" --target "$GITHUB_SHA")
          [ "$DRAFT" = "true" ] && args+=(--draft)
          gh release create "$EXT" "${args[@]}" "$OUT"/*.7z.* "$OUT/SHA256SUMS.txt"
          URL=$(gh release view "$EXT" --json url --jq .url)
          {
            echo "- published: $URL (draft=$DRAFT)"
            echo
            cat "$OUT/RELEASE_NOTES.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ needs.check.outputs.tag }}
          path: |
            ${{ steps.wd.outputs.dir }}/out/build.log
            ${{ steps.wd.outputs.dir }}/fsck-*.log
          if-no-files-found: ignore
