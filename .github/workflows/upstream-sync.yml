name: Upstream sync

# Once a day: fetch djparentx/dArkOSen-R36S main and, when it moved,
# push an "upstream-sync" branch and open (or refresh) a pull request
# into our default branch. Nothing is merged automatically.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM: djparentx/dArkOSen-R36S
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fetch upstream and prepare the sync branch
        id: prep
        run: |
          set -euo pipefail
          BASE='${{ github.event.repository.default_branch }}'
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" "origin/$BASE"; then
            echo "Already up to date with $UPSTREAM/$UPSTREAM_BRANCH"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(git rev-list --count --no-merges "origin/$BASE..upstream/$UPSTREAM_BRANCH")
          git log --no-merges --format='- %h %s (%an, %as)' "origin/$BASE..upstream/$UPSTREAM_BRANCH" > /tmp/commits.md
          git diff --stat "origin/$BASE...upstream/$UPSTREAM_BRANCH" | tail -1 > /tmp/diffstat.txt || true

          git checkout -B "$SYNC_BRANCH" "origin/$BASE"
          if git merge --no-edit -m "Merge upstream $UPSTREAM/$UPSTREAM_BRANCH" "upstream/$UPSTREAM_BRANCH"; then
            STATUS=clean
          else
            git merge --abort
            git reset --hard "upstream/$UPSTREAM_BRANCH"
            STATUS=conflict
          fi
          git push --force origin "$SYNC_BRANCH"

          {
            echo "changed=true"
            echo "status=$STATUS"
            echo "count=$COUNT"
            echo "upstream_sha=$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")"
          } >> "$GITHUB_OUTPUT"

      - name: Open or refresh the pull request
        if: steps.prep.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE='${{ github.event.repository.default_branch }}'
          STATUS='${{ steps.prep.outputs.status }}'
          TITLE="Sync with upstream $UPSTREAM (${{ steps.prep.outputs.count }} new commits, ${{ steps.prep.outputs.upstream_sha }})"
          {
            echo "Automated sync with [$UPSTREAM](https://github.com/$UPSTREAM/commits/$UPSTREAM_BRANCH)."
            echo
            if [ "$STATUS" = clean ]; then
              echo "The \`$SYNC_BRANCH\` branch is \`$BASE\` with upstream merged in cleanly. Merging this PR brings in the commits below and keeps everything under \`extended/\`."
            else
              echo "> **Conflicts.** Upstream could not be merged automatically, so \`$SYNC_BRANCH\` is an exact copy of upstream \`$UPSTREAM_BRANCH\`. Resolve the conflicts locally (\`git fetch origin $SYNC_BRANCH && git merge origin/$SYNC_BRANCH\`) and push, or use GitHub's conflict editor."
            fi
            echo
            echo "**Upstream commits**"
            echo
            cat /tmp/commits.md
            echo
            cat /tmp/diffstat.txt
            echo
            echo "_Refreshed $(date -u +'%Y-%m-%d %H:%M UTC') by the Upstream sync workflow. The branch is force-pushed on every refresh; do not commit to it directly._"
          } > /tmp/body.md

          NUM=$(gh pr list --head "$SYNC_BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh pr edit "$NUM" --title "$TITLE" --body-file /tmp/body.md
            echo "Updated PR #$NUM"
          else
            if ! gh pr create --head "$SYNC_BRANCH" --base "$BASE" --title "$TITLE" --body-file /tmp/body.md; then
              echo "::error::Could not create the pull request. In the repository settings, Actions > General, enable 'Allow GitHub Actions to create and approve pull requests'."
              exit 1
            fi
          fi
